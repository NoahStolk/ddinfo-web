version: 2
updates:
  - package-ecosystem: nuget
    directory: "/src"
    schedule:
      interval: monthly
    ignore:
      # Must match the Microsoft.IdentityModel.* version Microsoft.AspNetCore.Authentication.JwtBearer depends on; see Directory.Packages.props.
      - dependency-name: "System.IdentityModel.Tokens.Jwt"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
